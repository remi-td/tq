# Next-Generation Enterprise Omnichannel Data Platform 360 Benchmark Matrix
# Evaluates end-to-end data engineering:
#  - Bulk loading 25k+ records (FastLoad vs Python)
#  - Data quality exploration & remediation (nulls, mixed formats, duplicates)
#  - Dimensional & Fact modeling with Primary Index optimization
#  - Semantic layer generation (views & metric definitions)
#  - Analytical querying for executive insights

name: "enterprise-data-platform-360"
description: "Next-generation end-to-end data engineering benchmark evaluating bulk loading, DQ remediation, semantic modeling, and analytical querying"

dataset: "enterprise_data_platform_360"

runs:
  # 1. Gemini 3.5 Flash Lite (tq-with-skill)
  - id: "gemini_3_5_flash_lite_tq"
    harness: "gemini"
    model: "gemini-3.5-flash-lite"
    mode: "tq-with-skill"

  # 2. Gemini 2.5 Flash (tq-with-skill)
  - id: "gemini_2_5_flash_tq"
    harness: "gemini"
    model: "gemini-2.5-flash"
    mode: "tq-with-skill"

  # 3. Claude Code Haiku 4.5 (tq-with-skill)
  - id: "claude_haiku_4_5_tq"
    harness: "claude-code"
    model: "claude-haiku-4-5"
    mode: "tq-with-skill"

  # 4. Claude Code Sonnet (tq-with-skill)
  - id: "claude_sonnet_tq"
    harness: "claude-code"
    model: "sonnet"
    mode: "tq-with-skill"

  # 5. Pi Agent with Gemini 2.5 Flash (tq-with-skill)
  - id: "pi_gemini_2_5_flash_tq"
    harness: "pi"
    model: "gemini-2.5-flash"
    mode: "tq-with-skill"

  # 6. Baseline Python: Gemini 3.5 Flash Lite (no tq)
  - id: "baseline_gemini_3_5_flash_lite"
    harness: "gemini"
    model: "gemini-3.5-flash-lite"
    mode: "baseline-python"

  # 7. Baseline Python: Claude Code Sonnet (no tq)
  - id: "baseline_claude_sonnet"
    harness: "claude-code"
    model: "sonnet"
    mode: "baseline-python"
