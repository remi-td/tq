name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin to the toolchain declared in rust-toolchain.toml so a floating
      # `stable` cannot introduce new clippy lints that fail the build.
      # The version here MUST match rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Lint all targets (lib, bins, tests, examples) so warnings in
      # integration test code also fail CI — matches scripts/ci-check.sh.
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      # Run the full suite: unit + integration (tests/*.rs) + doc tests.
      # #[ignore]d live-DB / PTY tests are skipped automatically (no --ignored).
      - name: Run tests
        run: cargo test

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run audit
        run: cargo audit
