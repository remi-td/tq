[package]
name = "tq"
version = "1.49.0"
edition = "2021"
authors = ["Teradata Query Contributors"]
description = "A fast, lightweight command-line client for Teradata databases"
license = "MIT"
readme = "Readme.md"
repository = "https://github.com/remi-td/tq"
keywords = ["teradata", "database", "cli", "sql"]
categories = ["command-line-utilities", "database"]

[dependencies]
# CLI parsing
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# Database connectivity
teradatarustapi = { git = "https://github.com/Teradata/teradatarustapi", rev = "046a8b0faaa6eefa597dbd9fcfc575b066465d74" }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Output formatting
comfy-table = "7.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1"
csv = "1.3"

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"
directories = "5.0"
dotenvy = "0.15"

# Security
secrecy = { version = "0.8", features = ["serde"] }

# Utilities
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
atty = "0.2"

# File operations
tempfile = "3.10"

# Platform-specific: stdout suppression for metadata queries (Sprint 19)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# REPL / Interactive mode
reedline = "0.38"
chrono = "0.4"

# Syntax highlighting
nu-ansi-term = "0.50"

# Terminal / Paging
# Sprint 8: Custom pager using crossterm directly (removed minus dependency)
crossterm = "0.28"
unicode-width = "0.2"
arboard = { version = "3.6.1", features = ["image-data"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
expectrl = "0.7"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true

# Optimize dependencies even in dev mode
[profile.dev.package."*"]
opt-level = 3
